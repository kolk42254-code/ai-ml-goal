[pytest]
# Only look for tests in this folder. Skip the venv and other folders that never hold our tests.
norecursedirs = venv .* __pycache__ build dist node_modules *.egg

# Hide two harmless notices from other people's libraries (Google's and Starlette's), not from our code.
filterwarnings =
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    ignore:Using .httpx. with .starlette\.testclient. is deprecated
